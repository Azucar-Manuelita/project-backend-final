version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gym_postgres_db2
    restart: always
    environment:
      POSTGRES_DB: gym_db
      POSTGRES_USER: gym_admin
      POSTGRES_PASSWORD: gym_password123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: